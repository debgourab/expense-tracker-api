openapi: 3.1.0
info:
  title: Expense Tracker API
  version: 1.0.0
  description: Secure REST API for user-scoped expense tracking and spending analytics.
  contact:
    name: Deb Gourab Biswas
    url: https://github.com/debgourab
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://{service}.onrender.com
    description: Render deployment
    variables:
      service:
        default: expense-tracker-api
paths:
  /api:
    get:
      tags: [System]
      summary: Read service metadata
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
  /health:
    get:
      tags: [System]
      summary: Check process liveness
      responses:
        '200':
          description: API process is healthy
  /ready:
    get:
      tags: [System]
      summary: Check database readiness
      responses:
        '200':
          description: API and database are ready
        '503':
          description: Database is not connected
  /auth/signup:
    post:
      tags: [Authentication]
      summary: Create a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
  /auth/me:
    get:
      tags: [Authentication]
      summary: Read the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
        '401':
          $ref: '#/components/responses/Unauthorized'
  /expenses:
    get:
      tags: [Expenses]
      summary: List the authenticated user's expenses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, highest, lowest]
      responses:
        '200':
          description: Expense collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Expenses]
      summary: Create an expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
  /expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    get:
      tags: [Expenses]
      summary: Read one expense
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expense record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          description: Expense not found
    put:
      tags: [Expenses]
      summary: Update an expense
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: Updated expense
        '404':
          description: Expense not found
    delete:
      tags: [Expenses]
      summary: Delete an expense
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expense deleted
        '404':
          description: Expense not found
  /expenses/dashboard/category-totals:
    get:
      tags: [Dashboard]
      summary: Group spending by category
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category totals
  /expenses/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Read overall and current-month statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Spending summary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExpenseId:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SignupInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 72 }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [message, token, user]
      properties:
        message: { type: string }
        token: { type: string }
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    ExpenseInput:
      type: object
      additionalProperties: false
      required: [title, amount, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: number, minimum: 0.01, maximum: 100000000 }
        category: { type: string, minLength: 1, maxLength: 50 }
        date: { type: string, format: date }
    ExpenseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        amount: { type: number, minimum: 0.01, maximum: 100000000 }
        category: { type: string, minLength: 1, maxLength: 50 }
        date: { type: string, format: date }
    Expense:
      allOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - type: object
          required: [_id, userId, createdAt, updatedAt]
          properties:
            _id: { type: string }
            userId: { type: string }
            date: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        requestId: { type: string }
