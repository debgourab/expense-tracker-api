<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="top-bar">
        <div>
          <p class="eyebrow">Full-stack project</p>
          <h1>Expense Tracker</h1>
        </div>
        <button id="logoutButton" class="secondary hidden" type="button">Logout</button>
      </section>

      <section id="authPanel" class="auth-grid">
        <form id="signupForm" class="panel">
          <h2>Create account</h2>
          <label>
            Name
            <input id="signupName" type="text" placeholder="Asha Sharma" required />
          </label>
          <label>
            Email
            <input id="signupEmail" type="email" placeholder="asha@example.com" required />
          </label>
          <label>
            Password
            <input id="signupPassword" type="password" minlength="6" placeholder="Minimum 6 characters" required />
          </label>
          <button type="submit">Signup</button>
        </form>

        <form id="loginForm" class="panel">
          <h2>Login</h2>
          <label>
            Email
            <input id="loginEmail" type="email" placeholder="asha@example.com" required />
          </label>
          <label>
            Password
            <input id="loginPassword" type="password" placeholder="Your password" required />
          </label>
          <button type="submit">Login</button>
        </form>
      </section>

      <section id="appPanel" class="hidden app-grid">
        <form id="expenseForm" class="panel">
          <h2 id="formTitle">Add expense</h2>
          <input id="expenseId" type="hidden" />
          <label>
            Title
            <input id="expenseTitle" type="text" placeholder="Groceries" required />
          </label>
          <label>
            Amount
            <input id="expenseAmount" type="number" min="0.01" step="0.01" placeholder="750" required />
          </label>
          <label>
            Category
            <input id="expenseCategory" type="text" placeholder="Food" required />
          </label>
          <label>
            Date
            <input id="expenseDate" type="date" />
          </label>
          <div class="button-row">
            <button id="saveExpenseButton" type="submit">Save expense</button>
            <button id="cancelEditButton" class="secondary hidden" type="button">Cancel</button>
          </div>
        </form>

        <section class="panel">
          <div class="section-heading">
            <h2>Category totals</h2>
            <button id="refreshButton" class="secondary" type="button">Refresh</button>
          </div>
          <div id="dashboardList" class="dashboard-list"></div>
        </section>

        <section class="panel expense-panel">
          <h2>Expenses</h2>
          <div id="expenseList" class="expense-list"></div>
        </section>
      </section>

      <p id="message" class="message" role="status"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
